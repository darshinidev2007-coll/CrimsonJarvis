name: Build Debug APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Build APK
        run: |
          set -e
          SDK_DIR="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CrimsonJarvisDebugAPK
          path: app/build/outputs/apk/debug/app-debug.apk
